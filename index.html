<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Police Department Demo</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }

    .box {
      background: #222;
      padding: 30px;
      width: 350px;
      margin: auto;
      border-radius: 10px;
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 10px;
    }

    button {
      padding: 12px 30px;
      background: #0066cc;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>POLICE DEPARTMENT</h1>
    <p>Demo Login Page</p>

    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">

    <br>
    <button>LOGIN</button>

    <p>Demo credentials:</p>
    <p>Username: POLICE_DEMO</p>
    <p>Password: DemoPassword123!</p>
  </div>

</body>
</html>
